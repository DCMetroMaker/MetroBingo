<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.75">
  <title>MetroBingo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
        url("background2.JPG");
      margin: 0;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      background: #3a2c26;
      border-style: solid;
      border-color: #3a2c26;
      border-width: 10px;
      border-radius: 20px;
    }

    h1 {
      margin-bottom: 15px;
    }

    /* testing only
    div {
      border-style: solid;
      border-color: red;
    }
    */

    #header-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      max-width: 500px;
      margin: 0 auto 5px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #bingo-card {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .cell {
      background: #f2e5d8;
      color: black;
      border-radius: 8px;
      padding: 2%;
      width: 95%;
      height: 80px;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: bold;
      font-size: 11px;
      overflow: hidden;
    }

    .cell:hover {
      background: #b6d7a8;
    }

    .checked {
      background: #6aa84f !important;
      color: white;
      font-weight: bold;
    }

    .free {
      background: #6aa84f;
      color: white;
      font-weight: bold;
      cursor: default;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      transition: 0.2s;
      border-radius: 6px;
      background: #d72c2c;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: darkred;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 220px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MetroBingo</h1>

    <div id="header-row">
      <div>M</div>
      <div>E</div>
      <div>T</div>
      <div>R</div>
      <div>O</div>
    </div>

    <div id="bingo-card"></div>

    <button onclick="randomizeWithNewSeed()">Randomize Board</button>

    <div>
      <input id="seedInput">
      <button onclick="useCustomSeed()">Input Code</button>
    </div>
  </div>

  <script>
    const cardElement = document.getElementById("bingo-card");
    const seedInput = document.getElementById("seedInput");

    const phrases = [
      "Find a pre-2010 sign.",
      "Find a station without an entrance pylon.",
      "Find a railcar with an exterior wrap.",
      "Find a railcar with an exterior wrap.",
      "Find an ad with a military vehicle/aircraft featured.",
      "Find a sign with an outdated station name.",
      "Find an outdated map.",
      "Find a station with the new simplified signage.",
      "Find the first railcar of a series.",
      "Find the last (in service) railcar of a series.",
      "Find an Art in Transit piece.",
      "Find an out of service elevator or escalator.",
      "Find a Metro elevator with more than 2 floors.",
      "Find someone selling products on the platform.",
      "Find an outdated sticker on a sign.",
      "Find the pickle or the Money Train.",
      "Find an empty station manager’s booth.",
      "Watch someone attempt to hold open a Metro car door.",
      "Find a MARC locomotive.",
      "Find a VRE locomotive.",
      "Find a No Passengers train.",
      "Find a ? Train on a PID.",
      "Find a Newspapers sign.",
      "Find a PID not displaying all colors which serve the platform.",
      "Find an already cracked map display.",
      "Find an advertisement for an event which already passed.",
      "Find a temporary sign intended for train operators.",
      "Find a federal employee with ID visible.",
      "Find a closed station entrance or entrance provision.",
      "Ride a train when it stops and adjusts on the platform.",
      "Ride a train over a crossover or through a pocket track."];

    function seededRandom(seed) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) {
        hash = (hash << 5) - hash + seed.charCodeAt(i);
        hash |= 0;
      }

      return function() {
        hash = Math.imul(hash ^ (hash >>> 15), 1 | hash);
        hash ^= hash + Math.imul(hash ^ (hash >>> 7), 61 | hash);
        return ((hash ^ (hash >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffle(array, randomFunc) {
      let arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(randomFunc() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateCard(seed) {
      const rand = seededRandom(seed);

      // Only need 24 items now (center is fixed)
      const shuffled = shuffle(phrases, rand).slice(0, 24);

      cardElement.innerHTML = "";

      let index = 0;

      for (let i = 0; i < 25; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        // Center position (index 12)
        if (i === 12) {
          cell.textContent = "Find a 7K. (FREE)";
          cell.classList.add("free", "checked");
        } else {
          cell.textContent = shuffled[index++];

          cell.addEventListener("click", () => {
            cell.classList.toggle("checked");
          });
        }

        cardElement.appendChild(cell);
      }
    }

    function generateRandomSeed() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let seed = "";
      for (let i = 0; i < 10; i++) {
        seed += chars[Math.floor(Math.random() * chars.length)];
      }
      return seed;
    }

    function randomizeWithNewSeed() {
      const seed = generateRandomSeed();
      seedInput.value = seed;
      generateCard(seed);
    }

    function useCustomSeed() {
      const seed = seedInput.value.trim();
      if (seed !== "") {
        generateCard(seed);
      }
    }

    // Initial load
    randomizeWithNewSeed();
  </script>

</body>
</html>
