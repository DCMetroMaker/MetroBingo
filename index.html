<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MetroBingo</title>
  <style>
    body {
      font-family: Helvetica, sans-serif;
        linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
        url("background.jpg");
      margin: 0;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
    }

    h1 {
      margin-bottom: 15px;
    }

    div {
      border-style: solid;
      border-color: red;
    }

    #header-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      max-width: 500px;
      margin: 0 auto 5px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #bingo-card {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .cell {
      background: #3a2c26;
      color: white;
      border-radius: 8px;
      padding: 2%;
      width: 95%;
      height: 80px;
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      text-align: center;
      font-weight: bold;
    }

    .cell:hover {
      background: white;
    }

    .checked {
      background: gold !important;
      color: black;
      font-weight: bold;
    }
    
    .checked:hover {
      background: red;
    }

    .free {
      background: gold;
      color: black;
      font-weight: bold;
      cursor: default;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      border: none;
      border-radius: 6px;
      background: #3a2c26;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: red;
    }

    input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 220px;
      margin-top: 10px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>MetroBingo</h1>

    <div id="header-row">
      <div>M</div>
      <div>E</div>
      <div>T</div>
      <div>R</div>
      <div>O</div>
    </div>

    <div id="bingo-card"></div>

    <button onclick="randomizeWithNewSeed()">Randomize</button>

    <div>
      <input id="seedInput" placeholder="Enter or generate seed">
      <button onclick="useCustomSeed()">Submit</button>
    </div>
  </div>

  <script>
    const cardElement = document.getElementById("bingo-card");
    const seedInput = document.getElementById("seedInput");

    const phrases = Array.from({ length: 50 }, (_, i) => "Placeholder " + (i + 1));

    function seededRandom(seed) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) {
        hash = (hash << 5) - hash + seed.charCodeAt(i);
        hash |= 0;
      }

      return function() {
        hash = Math.imul(hash ^ (hash >>> 15), 1 | hash);
        hash ^= hash + Math.imul(hash ^ (hash >>> 7), 61 | hash);
        return ((hash ^ (hash >>> 14)) >>> 0) / 4294967296;
      };
    }

    function shuffle(array, randomFunc) {
      let arr = array.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(randomFunc() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generateCard(seed) {
      const rand = seededRandom(seed);

      // Only need 24 items now (center is fixed)
      const shuffled = shuffle(phrases, rand).slice(0, 24);

      cardElement.innerHTML = "";

      let index = 0;

      for (let i = 0; i < 25; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";

        // Center position (index 12)
        if (i === 12) {
          cell.textContent = "Find a 7K. (FREE)";
          cell.classList.add("free", "checked");
        } else {
          cell.textContent = shuffled[index++];

          cell.addEventListener("click", () => {
            cell.classList.toggle("checked");
          });
        }

        cardElement.appendChild(cell);
      }
    }

    function generateRandomSeed() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      let seed = "";
      for (let i = 0; i < 10; i++) {
        seed += chars[Math.floor(Math.random() * chars.length)];
      }
      return seed;
    }

    function randomizeWithNewSeed() {
      const seed = generateRandomSeed();
      seedInput.value = seed;
      generateCard(seed);
    }

    function useCustomSeed() {
      const seed = seedInput.value.trim();
      if (seed !== "") {
        generateCard(seed);
      }
    }

    // Initial load
    randomizeWithNewSeed();
  </script>

</body>
</html>
